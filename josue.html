<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Josué"/>
<meta name="theme-color" content="#0d0d0d"/>
<title>Josué</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;background:#0d0d0d;color:#f0ece4;font-family:'DM Sans',sans-serif;overscroll-behavior:none;}
input,select,textarea{font-family:'DM Sans',sans-serif;color-scheme:dark;-webkit-appearance:none;appearance:none;font-size:16px;}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:4px}
#app{padding-bottom:calc(70px + env(safe-area-inset-bottom));min-height:100vh;}
#hdr{padding:calc(14px + env(safe-area-inset-top)) 18px 0;position:sticky;top:0;z-index:200;background:#111;border-bottom:1px solid #1d1d1d;}
.hdr-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;}
.brand{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:4px;color:#c8a96e;line-height:1;}
.brand-sub{font-size:10px;color:#333;letter-spacing:2px;margin-top:2px;}
.hdr-date{text-align:right;}
.hdr-date-lbl{font-size:10px;color:#333;letter-spacing:1px;}
.hdr-date-val{font-family:'Bebas Neue',sans-serif;font-size:15px;color:#555;letter-spacing:1px;}
.tabs{display:flex;}
.tab{flex:1;padding:9px 2px;font-size:11px;font-weight:600;border:none;border-bottom:2px solid transparent;background:transparent;color:#555;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif;transition:color .15s;}
.tab.on{color:#c8a96e;border-bottom-color:#c8a96e;}
#content{padding:16px;}
/* Section head */
.sh{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:1.5px;color:#f0ece4;opacity:.45;margin-bottom:8px;}
/* Stat grid */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.stat-box{background:#161616;border:1px solid #1e1e1e;border-radius:12px;padding:11px 6px;text-align:center;}
.stat-n{font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;}
.stat-l{font-size:9px;color:#444;letter-spacing:.5px;margin-top:2px;}
/* Card */
.card{background:#161616;border:1px solid #1e1e1e;border-radius:12px;padding:12px 13px;margin-bottom:7px;display:flex;align-items:center;gap:11px;cursor:pointer;}
.card-bl{border-left:3px solid var(--c);}
.card-title{font-size:14px;font-weight:500;}
.card-sub{font-size:11px;color:#555;margin-top:2px;}
/* Pill */
.pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.3px;white-space:nowrap;}
/* Check circle */
.chk{width:20px;height:20px;border-radius:50%;flex-shrink:0;cursor:pointer;border:2px solid #2c2c2c;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.chk.done{background:#5aaa7e;border-color:#5aaa7e;}
.chk-mark{font-size:9px;color:white;font-weight:700;display:none;}
.chk.done .chk-mark{display:block;}
/* Btn */
.btn{padding:12px 18px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:700;font-family:'DM Sans',sans-serif;border:none;transition:opacity .15s;}
.btn:active{opacity:.75;}
.btn-gold{background:#c8a96e;color:#0a0a0a;}
.btn-sec{background:#1e1e1e;border:1px solid #2c2c2c !important;color:#666;font-weight:500;}
.btn-red{background:rgba(224,90,90,.12);border:1px solid #e05a5a44 !important;color:#e05a5a;font-weight:500;}
.btn-full{width:100%;display:block;text-align:center;}
.btn-row{display:flex;gap:8px;margin-top:4px;}
/* Overlay / Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:600;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s;}
.overlay.open{opacity:1;pointer-events:all;}
.sheet{background:#181818;border:1px solid #272727;border-radius:22px 22px 0 0;padding:18px 18px calc(40px + env(safe-area-inset-bottom));width:100%;max-height:92vh;overflow-y:auto;transform:translateY(110%);transition:transform .28s cubic-bezier(.32,.72,0,1);}
.overlay.open .sheet{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;background:#2c2c2c;border-radius:4px;margin:0 auto 14px;}
.sheet-title{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:1.5px;color:#f0ece4;opacity:.7;margin-bottom:14px;}
/* Form */
.fg{margin-bottom:12px;}
.fg-row{display:flex;gap:10px;}
.fg-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#555;margin-bottom:5px;}
.inp{width:100%;background:#1e1e1e;border:1px solid #2c2c2c;border-radius:10px;padding:11px 13px;color:#f0ece4;font-size:14px;outline:none;}
.inp:focus{border-color:#c8a96e55;}
textarea.inp{resize:none;line-height:1.6;}
/* Checkbox toggle */
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:14px;}
.toggle-box{width:20px;height:20px;border-radius:6px;border:2px solid #2c2c2c;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
.toggle-box.on{background:#c8a96e;border-color:#c8a96e;}
.toggle-box.on::after{content:'✓';font-size:11px;color:#0a0a0a;font-weight:700;}
.toggle-lbl{font-size:13px;color:#f0ece4;}
/* Summary card */
.sum-card{background:linear-gradient(135deg,#181208,#181818);border:1px solid #c8a96e22;border-radius:16px;padding:16px 18px;margin-bottom:14px;}
.sum-lbl{font-size:10px;color:#444;letter-spacing:1px;margin-bottom:3px;}
.sum-amt{font-family:'Bebas Neue',sans-serif;font-size:36px;color:#c8a96e;letter-spacing:2px;line-height:1;}
.sum-note{font-size:11px;color:#444;margin-top:4px;}
/* Progress bar */
.prog{height:3px;background:#222;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;}
.prog-fill{height:100%;border-radius:4px;background:#c8a96e;}
/* Note grid */
.note-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.note-card{background:#161616;border:1px solid #1e1e1e;border-radius:12px;padding:12px;cursor:pointer;min-height:80px;}
.note-card-title{font-size:13px;font-weight:600;margin-bottom:5px;}
.note-card-body{font-size:12px;color:#666;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;}
/* Subtask */
.sub-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.sub-del{background:none;border:none;color:#333;cursor:pointer;font-size:14px;padding:0;}
/* Color dots */
.color-dots{display:flex;gap:8px;flex-wrap:wrap;}
.cdot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border .15s;}
/* Finance sub-tabs */
.sub-tabs{display:flex;gap:8px;margin-bottom:16px;}
.sub-tab{flex:1;padding:9px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;border:1px solid #1e1e1e;background:#161616;color:#555;transition:all .15s;}
.sub-tab.on{background:#c8a96e;border-color:#c8a96e;color:#0a0a0a;}
/* Bar chart */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.bar-label{font-size:12px;color:#888;min-width:90px;}
.bar-track{flex:1;height:4px;background:#222;border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;background:#c8a96e;border-radius:4px;}
.bar-val{font-size:12px;color:#c8a96e;min-width:60px;text-align:right;}
/* Del btn */
.del-btn{background:none;border:none;color:#333;cursor:pointer;font-size:14px;padding:0;flex-shrink:0;}
/* Calendar */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-nav-btn{background:#161616;border:1px solid #1e1e1e;color:#f0ece4;border-radius:8px;padding:6px 14px;cursor:pointer;font-size:16px;}
.cal-month{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:#c8a96e;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-day-name{text-align:center;font-size:9px;font-weight:700;color:#444;padding:3px 0;}
.cal-cell{border-radius:9px;padding:5px 2px;cursor:pointer;min-height:46px;border:1px solid transparent;transition:all .12s;}
.cal-cell.today{background:rgba(200,169,110,.07);border-color:rgba(200,169,110,.4);}
.cal-cell.selected{background:rgba(200,169,110,.14);border-color:rgba(200,169,110,.5);}
.cal-cell-n{font-size:12px;text-align:center;margin-bottom:3px;}
.cal-cell.today .cal-cell-n{color:#c8a96e;font-weight:700;}
.cal-dots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;}
.cal-dot{width:5px;height:5px;border-radius:50%;}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 12px;}
.legend-item{display:flex;align-items:center;gap:4px;font-size:10px;color:#444;}
.legend-dot{width:6px;height:6px;border-radius:50%;}
/* Day detail */
.day-detail{background:#161616;border:1px solid #1e1e1e;border-radius:14px;padding:14px;margin-bottom:12px;}
/* Upcoming row */
.up-row{background:#161616;border:1px solid #1e1e1e;border-radius:12px;padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;gap:11px;}
.up-days{font-family:'Bebas Neue',sans-serif;font-size:16px;}
/* Cat section */
.cat-sec{margin-bottom:16px;}
.cat-hdr{display:flex;align-items:center;gap:7px;margin-bottom:8px;}
.cat-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.cat-name{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:1.5px;color:#f0ece4;opacity:.55;}
.cat-count{background:#1e1e1e;color:#444;border-radius:20px;padding:1px 8px;font-size:9px;margin-left:auto;}
</style>
</head>
<body>
<div id="app">
  <!-- HEADER -->
  <div id="hdr">
    <div class="hdr-top">
      <div>
        <div class="brand">JOSUÉ</div>
        <div class="brand-sub">MI ESPACIO</div>
      </div>
      <div class="hdr-date">
        <div class="hdr-date-lbl">HOY</div>
        <div class="hdr-date-val" id="hdr-date"></div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="tasks">✅ Tareas</button>
      <button class="tab" data-tab="fin">💳 Finanzas</button>
      <button class="tab" data-tab="cal">📅 Cal</button>
      <button class="tab" data-tab="notes">📝 Notas</button>
    </div>
  </div>

  <!-- CONTENT -->
  <div id="content"></div>
</div>

<!-- MODALS -->
<div class="overlay" id="ov-task"><div class="sheet" id="sh-task"></div></div>
<div class="overlay" id="ov-taskdetail"><div class="sheet" id="sh-taskdetail"></div></div>
<div class="overlay" id="ov-event"><div class="sheet" id="sh-event"></div></div>
<div class="overlay" id="ov-expense"><div class="sheet" id="sh-expense"></div></div>
<div class="overlay" id="ov-note"><div class="sheet" id="sh-note"></div></div>
<div class="overlay" id="ov-notedetail"><div class="sheet" id="sh-notedetail"></div></div>

<script>
// ─── Data ─────────────────────────────────────────────────────────────────────
const MONTHS = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DAYS   = ["D","L","M","M","J","V","S"];
const now = new Date(), TD = now.getDate(), TM = now.getMonth(), TY = now.getFullYear();

const EV_TYPES = {
  corte:      {label:"Corte tarjeta",    color:"#e05a5a", emoji:"✂️"},
  pago:       {label:"Pago / Límite",    color:"#f59e0b", emoji:"💳"},
  suscripcion:{label:"Suscripción",      color:"#5a9de0", emoji:"🔄"},
  ingreso:    {label:"Ingreso",          color:"#5aaa7e", emoji:"💰"},
  fecha:      {label:"Fecha importante", color:"#c084fc", emoji:"⭐"},
  cumple:     {label:"Cumpleaños",       color:"#f472b6", emoji:"🎂"},
  otro:       {label:"Otro",             color:"#94a3b8", emoji:"📌"},
};

const TASK_CATS = {
  "Personal":"#f472b6","Trabajo":"#c8a96e","Salud":"#5aaa7e",
  "Finanzas":"#5a9de0","Hogar":"#fb923c","Otro":"#94a3b8"
};
const EXP_CATS = ["Comida","Transporte","Entretenimiento","Ropa","Salud","Servicios","Negocio","Otro"];
const NOTE_COLORS = ["#c8a96e","#5a9de0","#5aaa7e","#f472b6","#c084fc","#f59e0b","#94a3b8"];

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmtMXN(n){ return "$"+Number(n).toLocaleString("es-MX",{minimumFractionDigits:0}); }
function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
function firstDay(y,m){ return new Date(y,m,1).getDay(); }

// ─── Storage ──────────────────────────────────────────────────────────────────
function load(key, def){ try{ const v=localStorage.getItem(key); return v?JSON.parse(v):def; }catch{ return def; } }
function save(key, val){ try{ localStorage.setItem(key,JSON.stringify(val)); }catch{} }

// ─── State ────────────────────────────────────────────────────────────────────
let tasks    = load("josue-tasks-v2",   [
  {id:"t1",title:"Registro de marca IMPI",cat:"Trabajo",prio:"alta",done:false,note:"impi.gob.mx — Clase 37 y/o 35",subtasks:[{id:"s1",title:"Buscar apoderado",done:false},{id:"s2",title:"Preparar documentos",done:false}]},
  {id:"t2",title:"Landing page Alpha Detailing",cat:"Trabajo",prio:"alta",done:false,note:"CTA WhatsApp, galería, cotizador",subtasks:[]},
  {id:"t3",title:"Configurar bots WhatsApp / IG / FB",cat:"Trabajo",prio:"media",done:false,note:"",subtasks:[{id:"s3",title:"WhatsApp",done:false},{id:"s4",title:"Instagram DM",done:false},{id:"s5",title:"Messenger",done:false}]},
]);
let events   = load("josue-events-v2",  [
  {id:"e1",title:"Corte BBVA",day:5,month:-1,year:null,repeat:true,type:"corte",amount:null,note:""},
  {id:"e2",title:"Pago BBVA",day:20,month:-1,year:null,repeat:true,type:"pago",amount:null,note:"Fecha límite"},
  {id:"e3",title:"Netflix",day:12,month:-1,year:null,repeat:true,type:"suscripcion",amount:219,note:""},
  {id:"e4",title:"Spotify",day:8,month:-1,year:null,repeat:true,type:"suscripcion",amount:109,note:""},
]);
let notes    = load("josue-notes-v2",   [
  {id:"n1",title:"Ideas negocio",body:"- Paquete mantenimiento mensual\n- Alianza con agencias de autos\n- Reels del proceso de ceramic coating",color:"#c8a96e",pinned:true,updatedAt:Date.now()},
]);
let expenses = load("josue-expenses-v2",[]);

// Calendar state
let curY = TY, curM = TM, selDay = null;
let activeTab = "tasks", finTab = "gastos";
let activeTaskId = null, activeNoteId = null;

// ─── Persist ──────────────────────────────────────────────────────────────────
function persist(){ save("josue-tasks-v2",tasks); save("josue-events-v2",events); save("josue-notes-v2",notes); save("josue-expenses-v2",expenses); }

// ─── Modal helpers ─────────────────────────────────────────────────────────────
function openModal(id){ document.getElementById("ov-"+id).classList.add("open"); }
function closeModal(id){ document.getElementById("ov-"+id).classList.remove("open"); }
document.querySelectorAll(".overlay").forEach(ov=>{
  ov.addEventListener("click",e=>{ if(e.target===ov) ov.classList.remove("open"); });
});

// ─── Render helpers ───────────────────────────────────────────────────────────
function priColor(p){ return p==="alta"?"#e05a5a":p==="media"?"#f59e0b":"#5aaa7e"; }
function priEmoji(p){ return p==="alta"?"🔴":p==="media"?"🟡":"🟢"; }
function pill(color,text){ return `<span class="pill" style="background:${color}22;color:${color}">${text}</span>`; }

function eventsForDay(d, y=curY, m=curM){
  return events.filter(ev=>{
    if(ev.day!==d) return false;
    if(ev.repeat||ev.month===-1) return true;
    return ev.month===m&&(!ev.year||ev.year===y);
  });
}

function upcomingThisMonth(){
  const dim=daysInMonth(curY,curM), list=[];
  for(let d=1;d<=dim;d++) eventsForDay(d).forEach(ev=>list.push({...ev,_d:d}));
  return list.sort((a,b)=>a._d-b._d);
}

// ─── Header date ─────────────────────────────────────────────────────────────
document.getElementById("hdr-date").textContent = `${TD} ${MONTHS[TM].slice(0,3).toUpperCase()} ${TY}`;

// ─── Tab switching ────────────────────────────────────────────────────────────
document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(b=>b.classList.remove("on"));
    btn.classList.add("on");
    activeTab = btn.dataset.tab;
    render();
  });
});

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  const c = document.getElementById("content");
  if(activeTab==="tasks")  c.innerHTML = renderTasks();
  if(activeTab==="fin")    c.innerHTML = renderFin();
  if(activeTab==="cal")    c.innerHTML = renderCal();
  if(activeTab==="notes")  c.innerHTML = renderNotes();
  bindEvents();
}

// ══ TASKS ══
function renderTasks(){
  const pending = tasks.filter(t=>!t.done);
  const done    = tasks.filter(t=>t.done);
  let h = `
  <div class="stat-grid">
    <div class="stat-box"><div class="stat-n" style="color:#c8a96e">${tasks.length}</div><div class="stat-l">TOTAL</div></div>
    <div class="stat-box"><div class="stat-n" style="color:#e05a5a">${pending.length}</div><div class="stat-l">PENDIENTES</div></div>
    <div class="stat-box"><div class="stat-n" style="color:#5aaa7e">${done.length}</div><div class="stat-l">LISTAS</div></div>
  </div>`;

  Object.keys(TASK_CATS).forEach(cat=>{
    const ct = pending.filter(t=>t.cat===cat);
    if(!ct.length) return;
    const color = TASK_CATS[cat];
    h += `<div class="cat-sec">
      <div class="cat-hdr">
        <div class="cat-dot" style="background:${color}"></div>
        <div class="cat-name">${cat.toUpperCase()}</div>
        <div class="cat-count">${ct.length}</div>
      </div>`;
    ct.forEach(t=>{
      const subDone = t.subtasks.filter(s=>s.done).length;
      const subTotal = t.subtasks.length;
      const pc = priColor(t.prio);
      h += `<div class="card card-bl" style="--c:${pc}" data-action="task-detail" data-id="${t.id}">
        <div class="chk${t.done?" done":""}" data-action="toggle-task" data-id="${t.id}"><span class="chk-mark">✓</span></div>
        <div style="flex:1;min-width:0">
          <div class="card-title">${t.title}</div>
          ${subTotal?`<div class="card-sub">${subDone}/${subTotal} subtareas
            <span class="prog" style="width:40px;margin-left:6px"><span class="prog-fill" style="width:${subTotal?subDone/subTotal*100:0}%;background:${color}"></span></span>
          </div>`:""}
        </div>
        ${pill(pc,priEmoji(t.prio)+" "+t.prio)}
      </div>`;
    });
    h += `</div>`;
  });

  if(done.length){
    h += `<div class="sh" style="margin-top:4px">✅ COMPLETADAS</div>`;
    done.forEach(t=>{
      h += `<div class="card" style="opacity:.38">
        <div class="chk done" data-action="toggle-task" data-id="${t.id}"><span class="chk-mark">✓</span></div>
        <div style="flex:1;font-size:13px;text-decoration:line-through">${t.title}</div>
        <button class="del-btn" data-action="del-task" data-id="${t.id}">🗑</button>
      </div>`;
    });
  }

  h += `<button class="btn btn-gold btn-full" data-action="open-task" style="margin-top:8px">+ Nueva tarea</button>`;
  return h;
}

// ══ FINANZAS ══
function renderFin(){
  let h = `<div class="sub-tabs">
    <button class="sub-tab${finTab==="gastos"?" on":""}" data-action="fin-tab" data-tab="gastos">💸 Gastos</button>
    <button class="sub-tab${finTab==="recurrentes"?" on":""}" data-action="fin-tab" data-tab="recurrentes">🔄 Recurrentes</button>
  </div>`;

  if(finTab==="gastos"){
    const thisM = expenses.filter(e=>{ const d=new Date(e.date); return d.getMonth()===TM&&d.getFullYear()===TY; });
    const total = thisM.reduce((s,e)=>s+e.amount,0);
    h += `<div class="sum-card">
      <div class="sum-lbl">GASTO ESTE MES — ${MONTHS[TM].toUpperCase()} ${TY}</div>
      <div class="sum-amt">${fmtMXN(total)}<span style="font-size:13px;color:#444"> MXN</span></div>
      <div class="sum-note">${thisM.length} registros</div>
    </div>`;

    // By category
    const byCat = {};
    EXP_CATS.forEach(c=>{ byCat[c]=thisM.filter(e=>e.cat===c).reduce((s,e)=>s+e.amount,0); });
    const hasCat = Object.entries(byCat).filter(([,v])=>v>0).sort(([,a],[,b])=>b-a);
    if(hasCat.length){
      h += `<div class="card" style="flex-direction:column;align-items:stretch;cursor:default;margin-bottom:14px">
        <div class="sh" style="margin-bottom:10px">POR CATEGORÍA</div>`;
      hasCat.forEach(([c,v])=>{

// ══ CALENDAR ══
function renderCal(){
  const dim=daysInMonth(curY,curM), fd=firstDay(curY,curM);
  let cells = ``;
  DAYS.forEach(d=>{ cells+=`<div class="cal-day-name">${d}</div>`; });
  for(let i=0;i<fd;i++) cells+=`<div></div>`;
  for(let d=1;d<=dim;d++){
    const isToday=d===TD&&curM===TM&&curY===TY;
    const isSel=selDay===d;
    const dayEvs=eventsForDay(d);
    const dots=dayEvs.slice(0,4).map(ev=>`<div class="cal-dot" style="background:${(EV_TYPES[ev.type]||EV_TYPES.otro).color}"></div>`).join("");
    cells+=`<div class="cal-cell${isToday?" today":""}${isSel?" selected":""}" data-action="cal-day" data-d="${d}">
      <div class="cal-cell-n" style="color:${isToday?"#c8a96e":"#d0ccc4"}">${d}</div>
      <div class="cal-dots">${dots}</div>
    </div>`;
  }

  let legend = `<div class="legend">`;
  Object.entries(EV_TYPES).forEach(([,v])=>{ legend+=`<div class="legend-item"><div class="legend-dot" style="background:${v.color}"></div>${v.emoji}</div>`; });
  legend += `</div>`;

  let selDetail = "";
  if(selDay){
    const sevs = eventsForDay(selDay);
    selDetail = `<div class="day-detail">
      <div class="sh" style="margin-bottom:10px">${selDay} DE ${MONTHS[curM].toUpperCase()}</div>`;
    if(!sevs.length) selDetail+=`<div style="color:#444;font-size:13px">Sin eventos este día.</div>`;
    sevs.forEach(ev=>{
      const m=EV_TYPES[ev.type]||EV_TYPES.otro;
      selDetail+=`<div style="background:#1a1a1a;border:1px solid ${m.color}22;border-radius:10px;padding:10px 12px;margin-bottom:7px;display:flex;gap:10px;align-items:center">
        <span style="font-size:16px">${m.emoji}</span>
        <div style="flex:1">
          <div style="font-size:14px;font-weight:500">${ev.title}</div>
          ${ev.amount?`<div style="font-size:11px;color:${m.color};margin-top:1px">${fmtMXN(ev.amount)} MXN</div>`:""}
          ${ev.note?`<div style="font-size:11px;color:#555;margin-top:1px">${ev.note}</div>`:""}
        </div>
        <button class="del-btn" data-action="del-event" data-id="${ev.id}">🗑</button>
      </div>`;
    });
    selDetail += `</div>`;
  }

  const upcoming = upcomingThisMonth().filter(e=>e._d>=TD);
  let upHtml = `<div class="sh">PRÓXIMOS EN ${MONTHS[curM].toUpperCase()}</div>`;
  if(!upcoming.length) upHtml+=`<div style="color:#444;font-size:13px;margin-bottom:12px">Sin eventos próximos.</div>`;
  upcoming.forEach(ev=>{
    const m=EV_TYPES[ev.type]||EV_TYPES.otro;
    const dl=ev._d-TD;
    upHtml+=`<div class="up-row card-bl" style="--c:${m.color}">
      <div style="font-size:17px">${m.emoji}</div>
      <div style="flex:1">
        <div class="card-title">${ev.title}</div>
        <div class="card-sub">Día ${ev._d}${ev.repeat?" · Mensual":""}${ev.amount?" · "+fmtMXN(ev.amount)+" MXN":""}</div>
      </div>
      <div class="up-days" style="color:${dl<=0?"#e05a5a":dl<=5?"#f59e0b":"#555"}">${dl<=0?"HOY":dl+"d"}</div>
    </div>`;
  });

  return `
  <div class="cal-nav">
    <button class="cal-nav-btn" data-action="cal-prev">‹</button>
    <div class="cal-month">${MONTHS[curM]} ${curY}</div>
    <button class="cal-nav-btn" data-action="cal-next">›</button>
  </div>
  <div class="cal-grid">${cells}</div>
  ${legend}
  ${selDetail}
  ${upHtml}
  <button class="btn btn-gold btn-full" data-action="open-event" style="margin-top:8px">+ Agregar evento</button>`;
}

// ══ NOTES ══
function renderNotes(){
  const pinned   = notes.filter(n=>n.pinned);
  const unpinned = notes.filter(n=>!n.pinned);
  let h = "";
  if(pinned.length){
    h += `<div class="sh">📌 FIJADAS</div><div class="note-grid">`;
    pinned.forEach(n=>{
      h+=`<div class="note-card" style="border-top:3px solid ${n.color}" data-action="note-detail" data-id="${n.id}">
        ${n.title?`<div class="note-card-title" style="color:${n.color}">${n.title}</div>`:""}
        <div class="note-card-body">${n.body||'<span style="color:#333;font-style:italic">Sin contenido</span>'}</div>
      </div>`;
    });
    h += `</div>`;
  }
  if(unpinned.length){
    h += `<div class="sh">TODAS</div><div class="note-grid">`;
    unpinned.forEach(n=>{
      h+=`<div class="note-card" style="border-top:3px solid ${n.color}" data-action="note-detail" data-id="${n.id}">
        ${n.title?`<div class="note-card-title" style="color:${n.color}">${n.title}</div>`:""}
        <div class="note-card-body">${n.body||'<span style="color:#333;font-style:italic">Sin contenido</span>'}</div>
      </div>`;
    });
    h += `</div>`;
  }
  if(!notes.length) h+=`<div style="color:#444;font-size:13px;margin-bottom:14px">Sin notas todavía.</div>`;
  h+=`<button class="btn btn-gold btn-full" data-action="open-note">+ Nueva nota</button>`;
  return h;
}

// ─── Bind events ──────────────────────────────────────────────────────────────
function bindEvents(){
  document.getElementById("content").addEventListener("click", handleAction);
}

function handleAction(e){
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.dataset.action, id = el.dataset.id;

  if(action==="toggle-task"){ e.stopPropagation(); tasks=tasks.map(t=>t.id===id?{...t,done:!t.done}:t); persist(); render(); }
  if(action==="del-task")   { e.stopPropagation(); tasks=tasks.filter(t=>t.id!==id); persist(); render(); }
  if(action==="open-task")  { renderTaskModal(); openModal("task"); }
  if(action==="task-detail"){ activeTaskId=id; renderTaskDetail(); openModal("taskdetail"); }
  if(action==="del-event")  { events=events.filter(ev=>ev.id!==id); persist(); render(); }
  if(action==="open-event") { renderEventModal(); openModal("event"); }
  if(action==="del-expense"){ expenses=expenses.filter(ex=>ex.id!==id); persist(); render(); }
  if(action==="open-expense"){ renderExpenseModal(); openModal("expense"); }
  if(action==="open-note")  { renderNoteModal(); openModal("note"); }
  if(action==="note-detail"){ activeNoteId=id; renderNoteDetail(); openModal("notedetail"); }
  if(action==="fin-tab")    { finTab=el.dataset.tab; render(); }
  if(action==="cal-prev")   { if(curM===0){curM=11;curY--;}else curM--; selDay=null; render(); }
  if(action==="cal-next")   { if(curM===11){curM=0;curY++;}else curM++; selDay=null; render(); }
  if(action==="cal-day")    { const d=parseInt(el.dataset.d); selDay=selDay===d?null:d; render(); }
}

    if(e.key==="Enter") document.getElementById("det-sub-add").click();

  });
}

  };
}

// ─── Note Detail ──────────────────────────────────────────────────────────────
function renderNoteDetail(){
  const n=notes.find(n=>n.id===activeNoteId);
  if(!n) return;
  document.getElementById("sh-notedetail").innerHTML=`
  <div class="sheet-handle"></div>
  <div class="sheet-title" style="color:${n.color}">${n.title||"Nota"}</div>
  <textarea class="inp" id="nd-body" style="min-height:200px;border-color:${n.color}44;line-height:1.7">${n.body}</textarea>
  <div style="font-size:10px;color:#444;margin:8px 0 14px">Guardado automático al cerrar</div>
  <div class="btn-row">
    <button class="btn btn-sec" id="nd-close">Cerrar</button>
    <button class="btn btn-sec" id="nd-pin">${n.pinned?"📌 Desfijar":"📌 Fijar"}</button>
    <button class="btn btn-red" id="nd-del">🗑</button>
  </div>`;
  document.getElementById("nd-close").onclick=()=>{
    const body=document.getElementById("nd-body").value;
    notes=notes.map(nx=>nx.id===activeNoteId?{...nx,body,updatedAt:Date.now()}:nx);
    persist(); closeModal("notedetail"); render();
  };
  document.getElementById("nd-pin").onclick=()=>{
    notes=notes.map(nx=>nx.id===activeNoteId?{...nx,pinned:!nx.pinned}:nx);
    persist(); renderNoteDetail(); render();
  };
  document.getElementById("nd-del").onclick=()=>{
    notes=notes.filter(nx=>nx.id!==activeNoteId); persist(); closeModal("notedetail"); render();
  };
}

// ─── Init ─────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
